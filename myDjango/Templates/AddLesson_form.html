{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Lesson - Japanese Learning</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Poppins', sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #e6f0ff;
        overflow: hidden;
    }

    .upload-container {
        display: flex;
        width: 850px;
        max-width: 95%;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 12px 30px rgba(0,0,0,0.1);
        background: #fff;
        position: relative;
    }

    /* Left Panel */
    .left-panel {
        width: 50%;
        padding: 50px 30px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
        z-index: 3;
    }

    .left-panel h2 {
        font-size: 2rem;
        color: #1a2a4b;
        margin-bottom: 20px;
    }

    form {
        width: 100%;
        max-width: 300px;
        margin: 0 auto;
        text-align: left;
    }

    .input-group {
        margin-bottom: 15px;
    }

    .input-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
        color: #004466;
    }

    .input-group input,
    .input-group textarea,
    .input-group select {
        width: 100%;
        padding: 12px;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 1rem;
        transition: border 0.3s;
    }

    .input-group input:focus,
    .input-group textarea:focus,
    .input-group select:focus {
        border-color: #4da6ff;
        outline: none;
    }

    .input-group input[type="file"] {
        border: 2px dashed #aaa;
        background: #f9f9f9;
        text-align: center;
    }

    .btn {
        width: 100%;
        padding: 14px;
        margin-top: 15px;
        background: #4da6ff;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn:hover {
        background: #1a75ff;
    }

    .errorlist {
        color: #e94560;
        font-size: 13px;
        margin-top: 5px;
    }

    a.back-link {
        display: inline-block;
        margin-top: 15px;
        font-size: 0.95rem;
        color: #4da6ff;
        text-decoration: none;
        font-weight: 600;
    }

    a.back-link:hover {
        color: #1a75ff;
        text-decoration: underline;
    }

    /* Right Panel */
    .right-panel {
        width: 50%;
        background: linear-gradient(135deg, #cce0ff, #e6f0ff);
        position: relative;
        overflow: hidden;
    }

    .wave-shape {
        position: absolute;
        left: -100px;
        top: 0;
        bottom: 0;
        width: 200px;
        background: #fff;
        border-radius: 0 100px 100px 0;
        z-index: 2;
    }

    /* Floating shapes */
    .shape {
        position: absolute;
        border-radius: 50%;
        opacity: 0.2;
        animation: float 10s linear infinite;
    }
    .shape1 { width: 60px; height: 60px; background: #4da6ff; top: 20%; left: 10%; animation-delay: 0s; }
    .shape2 { width: 40px; height: 40px; background: #1a75ff; top: 50%; left: 20%; animation-delay: 2s; }
    .shape3 { width: 80px; height: 80px; background: #4da6ff; top: 70%; left: 60%; animation-delay: 4s; }

    @keyframes float {
        0% { transform: translateY(0) translateX(0); }
        50% { transform: translateY(-20px) translateX(10px); }
        100% { transform: translateY(0) translateX(0); }
    }

    /* Responsive */
    @media (max-width: 768px) {
        .upload-container {
            flex-direction: column;
        }
        .left-panel, .right-panel {
            width: 100%;
        }
        .left-panel {
            padding: 30px 20px;
        }
    }
</style>
</head>
<body>
<div class="upload-container">

    <!-- Left Panel -->
    <div class="left-panel">
        <h2>➕ Add Lesson</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {% for field in form %}
                <div class="input-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <ul class="errorlist">
                        {% for error in field.errors %}
                            <li>⚠️ {{ error }}</li>
                        {% endfor %}
                        </ul>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn">Add Lesson</button>
        </form>
        <a href="javascript:history.back()" class="back-link">← Back</a>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
        <div class="wave-shape"></div>
        <div class="shape shape1"></div>
        <div class="shape shape2"></div>
        <div class="shape shape3"></div>
    </div>

</div>
</body>
</html>
