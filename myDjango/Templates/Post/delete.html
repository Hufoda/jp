{% extends 'Master.html' %}

{% block title %}Delete Post - Learn Japanese{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg p-4 text-center">
                <h2 class="text-danger"> Confirm Deletion</h2>
                <p class="mb-3">Are you sure you want to delete this post?</p>

                <div class="alert alert-warning">
                    <strong>{{ post.text }}</strong>
                </div>

                {% if post.image %}
                    <img src="{{ post.image.url }}" class="img-fluid rounded mb-3" alt="Uploaded Image">
                {% endif %}

                <form method="POST"  action="{% url 'delete_post' post.id %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger w-100">🗑 Yes, Delete</button>
                </form>
                <a href="{% url 'view_posts' %}" class="btn btn-outline-secondary w-100 mt-3">❌ Cancel</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
