{% extends 'Master.html' %}

{% block title %}Upload News - Learn Japanese{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg p-4">
                <h2 class="text-center mb-4">📢 Upload Latest News</h2>
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="form-group">
                        {{ form.as_p }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-2">📤 Upload News</button>
                </form>
                <a href="{% url 'view_posts' %}" class="btn btn-outline-secondary w-100 mt-3">📜 View All Posts</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
