<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - WordWhiz</title>
{% load static %}


<style>
    /* ---------------- Base ---------------- */
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* ---------------- Header ---------------- */
    .page-header {
        width: 100%;
        background: rgba(255,255,255,0.9);
        backdrop-filter: blur(10px);
        padding: 15px 40px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        position: fixed;
        top: 0;
        z-index: 1000;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .site-logo {
        display: flex;
        align-items: center;
        font-weight: 800;
        font-size: 1.8rem;
        color: #2c3e50;
    }

    .site-logo img {
        height: 45px;
        margin-right: 10px;
    }

    .welcome {
        font-weight: 600;
        color: #4a4a4a;
        font-size: 1rem;
    }

    /* ---------------- Bubble Section ---------------- */
    .bubble-container {
        margin-top: 120px;
        text-align: center;
        animation: fadeIn 1s ease forwards;
    }

    .bubble {
        display: inline-block;
        background: #ffffff;
        padding: 18px 30px;
        border-radius: 35px;
        font-size: 1.3em;
        color: #2c3e50;
        box-shadow: 0 10px 20px rgba(0,0,0,0.08);
        transition: transform 0.3s;
    }

    .bubble:hover {
        transform: translateY(-5px);
    }

    .ic img {
        max-width: 380px;
        margin-top: 25px;
    }

    /* ---------------- Login Form ---------------- */
    .container {
        display: flex;
        justify-content: center;
        width: 100%;
        padding: 50px 20px;
        animation: fadeIn 1s ease forwards;
    }

    .login-form {
        background: #ffffff;
        padding: 45px 35px;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.08);
        width: 360px;
        text-align: center;
        transition: transform 0.3s, box-shadow 0.3s;
    }

    .login-form:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 50px rgba(0,0,0,0.12);
    }

    .login-form h2 {
        margin-bottom: 25px;
        color: #2c3e50;
        font-weight: 700;
    }

    .input-group {
        margin-bottom: 18px;
        text-align: left;
    }

    .input-group label {
        font-size: 0.95em;
        color: #555;
        display: block;
        margin-bottom: 6px;
    }

    .input-group input {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ccc;
        border-radius: 10px;
        outline: none;
        transition: all 0.3s;
        font-size: 1em;
    }

    .input-group input:focus {
        border-color: #3498db;
        box-shadow: 0 0 8px rgba(52,152,219,0.3);
    }

    button {
        width: 100%;
        padding: 14px;
        background: linear-gradient(90deg, #3498db, #2980b9);
        border: none;
        border-radius: 10px;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        font-size: 1em;
        transition: background 0.3s, transform 0.2s;
    }

    button:hover {
        background: linear-gradient(90deg, #2980b9, #3498db);
        transform: translateY(-2px);
    }

    .register-link {
        margin-top: 18px;
        font-size: 0.9em;
        color: #555;
    }

    .register-link a {
        color: #3498db;
        font-weight: 600;
        text-decoration: none;
    }

    .register-link a:hover {
        text-decoration: underline;
    }

    /* ---------------- Error Messages ---------------- */
    .error-messages {
        background: #ffe6e6;
        border: 1px solid #ff4d4d;
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 15px;
    }

    .error-text {
        color: #d63031;
        font-size: 0.9em;
        margin: 0;
    }

    /* ---------------- Animations ---------------- */
    @keyframes fadeIn {
        0% { opacity: 0; transform: translateY(-20px);}
        100% { opacity: 1; transform: translateY(0);}
    }
</style>
</head>
<body>
<header class="page-header">
    <div class="site-logo">
        <img src="{% static 'images/WordWhiz.png' %}" alt="WordWhiz Logo">
        WordWhiz
    </div>
    <div class="welcome">Ready to Learn Japanese</div>
</header>

<div class="bubble-container">
    <div class="bubble">
        Japanese <span id="changing-word" style="text-decoration:underline;font-weight:bold;">Kanji</span> made for me
    </div>
    <div class="ic">
        <img src="{% static 'images/img22.png' %}" alt="Cute Sticker">
    </div>
</div>

<div class="container">
    <div class="login-form">
        <h2>Login</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            {% if messages %}
            <div class="error-messages">
                {% for message in messages %}
                    <p class="error-text">{{ message }}</p>
                {% endfor %}
            </div>
            {% endif %}
            <button type="submit">Login</button>
            <p class="register-link">Don't have an account? <a href="{% url 'register' %}">Register Here</a></p>
        </form>
    </div>
</div>

<script src="{% static 'script.js' %}"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
    gsap.from(".container", { duration: 1, y: 50, opacity: 0, ease: "power2.out" });
    gsap.from(".bubble-container", { duration: 1, y: 50, opacity: 0, ease: "power2.out", delay: 0.3 });
</script>
</body>
</html>
