<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Flashcards</title>
    <style>
        /* General body & container */
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            margin: 0;
            padding: 20px;

        background: #e6f0ff;

            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            color: #002233; /* dark navy */
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            color: #555;
        }

        /* Flashcard container */
        .flashcard-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .flashcard {
            width: 350px;
            height: 400px;
            perspective: 1200px;
            cursor: pointer;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            border-radius: 20px;
        }

        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            background: #fff;
        }

      .flashcard-back {
    transform: rotateY(180deg);

    border: 2px solid #004466;
}


        .flashcard img {
            width: 90%;
            height: 90%;
            object-fit: cover;
            border-radius: 12px;
        }

        /* Navigation buttons */
        .navigation {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        button {
            background: linear-gradient(90deg, #ff758c, #ff7eb3);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        button:disabled {
            background-color: #ccc;
            color: #555;
            cursor: not-allowed;
        }

        /* Card counter */
        .card-counter {
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #004466;
        }

        /* Instructions */
        .instructions {
            text-align: center;
            color: #666;
            margin-top: 20px;
            font-size: 14px;
        }

        /* Admin add button */
        .admin-actions a {
            display: inline-block;
            background: linear-gradient(90deg, #ff758c, #ff7eb3);
            color: #fff;
            font-weight: 600;
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            transition: transform 0.2s ease, opacity 0.2s ease;
            margin-bottom: 20px;
        }

        .admin-actions a:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .flashcard {
                width: 280px;
                height: 350px;
            }

            .flashcard img {
                width: 90%;
                height: 90%;
            }

            button {
                padding: 8px 15px;
                font-size: 14px;
            }

            .admin-actions a {
                padding: 10px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Image Flashcards</h1>
            <p>Click on the card to flip between front and back images</p>
        </div>

        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
