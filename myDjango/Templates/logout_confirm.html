<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging Out...</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f5f7; /* Soft neutral background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 400px;
            animation: fadeIn 0.5s ease-in-out;
        }

        h2 {
            color: #111827; /* Dark gray for title */
            font-weight: 600;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        .btn-container {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        /* Modern Buttons */
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .btn-danger {
            background: #ef4444; /* Soft red */
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-secondary {
            background: #9ca3af; /* Gray */
            color: white;
        }

        .btn-secondary:hover {
            background: #6b7280;
        }

        /* Loading Animation */
        .loading-container {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .loading-text {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 15px;
            color: #111827;
        }

        .loading-dots {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dot {
            width: 12px;
            height: 12px;
            margin: 0 5px;
            background-color: #ef4444;
            border-radius: 50%;
            animation: bounce 1.5s infinite ease-in-out;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.3;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Fade In Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container" id="logoutBox">
    <h2>Are you sure you want to log out?</h2>
    <div class="btn-container">
        <button class="btn btn-danger" onclick="startLogout()">Log Out</button>
        <button class="btn btn-secondary" onclick="goBack()">Cancel</button>
    </div>
</div>

<!-- Loading Animation -->
<div class="container hidden" id="loadingBox">
    <p class="loading-text">Logging out...</p>
    <div class="loading-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>
</div>

<script>
    function startLogout() {
        document.getElementById("logoutBox").classList.add("hidden");
        document.getElementById("loadingBox").classList.remove("hidden");

        setTimeout(() => {
            window.location.href = "{% url 'start' %}";
        }, 2000);
    }

    function goBack() {
        window.history.back();
    }
</script>

</body>
</html>
