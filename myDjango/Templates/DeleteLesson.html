<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Lesson</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'test2.css' %}">
</head>
<body>
    <h2>Are you sure you want to delete this lesson?</h2>
    <form method="POST">
        {% csrf_token %}
        <p>Title: {{ lesson.title }}</p>
        <input type="submit" value="Delete Lesson">
    </form>
    <br>
    <a href="{% url 'level_selection' %}">Cancel</a>
</body>
</html>
