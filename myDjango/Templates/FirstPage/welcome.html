{% load static %}

<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  .welcome-container {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    background: linear-gradient(135deg, #f0f4ff, #ffffff);
    padding: 40px 20px;
  }

  .welcome-content {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 60px;
    max-width: 1000px;
    width: 100%;
  }

  /* Animations */
  @keyframes slideInLeft {
    from {
      opacity: 0;
      transform: translateX(-50px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .welcome-image img {
    max-width: 400px;
    width: 100%;
    border-radius: 20px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.1);
    animation: slideInLeft 1s ease forwards;
  }

  .welcome-text {
    display: flex;
    flex-direction: column;
    gap: 25px;
    animation: fadeInUp 1s ease forwards;
    animation-delay: 0.3s;
    opacity: 0; /* start hidden */
  }

  .welcome-text h1 {
    font-size: 3rem;
    color: #333;
    margin: 0;
  }

  .welcome-text p {
    font-size: 1.2rem;
    color: #555;
    line-height: 1.6;
    max-width: 500px;
  }

  .btn {
    background: linear-gradient(135deg, #6c63ff, #5a52e5);
    color: #fff;
    padding: 12px 28px;
    font-size: 1.1rem;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    width: fit-content;
  }

  .btn:hover {
    background: linear-gradient(135deg, #5a52e5, #483fda);
    transform: translateY(-3px);
  }

  /* Responsive adjustments */
  @media (max-width: 900px) {
    .welcome-content {
      flex-direction: column;
      gap: 30px;
      text-align: center;
    }

    .welcome-image img {
      max-width: 250px;
    }

    .welcome-text h1 {
      font-size: 2.2rem;
    }

    .welcome-text p {
      font-size: 1rem;
    }
  }
</style>

<div class="welcome-container">
  <div class="welcome-content">
    <!-- Image on the left -->
    <div class="welcome-image">
      <img src="{% static 'images/start.png' %}" alt="Say hello">
    </div>

    <!-- Text on the right -->
    <div class="welcome-text">
      <h1>Say Hello!</h1>
      <p>
        I'd love to hear from you and always welcome any feedback –
        please don't hesitate to get in touch!
      </p>
      <a href="{% url 'login' %}" class="btn">Say Hey!</a>
    </div>
  </div>
</div>
